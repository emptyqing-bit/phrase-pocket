name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build archives
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Test browser storage and desktop bridge
        shell: pwsh
        run: |
          node ./scripts/browser-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ./scripts/smoke.mjs --bundled-dictionary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: phrase-pocket
          path: build/PhrasePocket-*.zip
          if-no-files-found: error

  release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: phrase-pocket
          path: packages
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er '.version' extension/manifest.json)
          test "$(git log -1 --format=%s)" = "Release v$version"
          gh release create "v$version" --target "$GITHUB_SHA" --title "随手收 v$version" \
            --notes-file "releases/v$version.md" \
            "packages/PhrasePocket-Extension-$version.zip" "packages/PhrasePocket-Windows-$version.zip"
