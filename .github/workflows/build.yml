name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build archives
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Test browser storage and desktop bridge
        shell: pwsh
        run: |
          node ./scripts/browser-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ./scripts/smoke.mjs --bundled-dictionary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: phrase-pocket
          path: build/PhrasePocket-*.zip
          if-no-files-found: error
